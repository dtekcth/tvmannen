name: Bump version

on:
  workflow_dispatch:
    update_type:
      type:
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-local:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Bump version locally
        run: "uv version --bump ${{ inputs.update_type }}"

      - name: Get new version
        id: new_version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

  bump-remote:
    needs: bump-local
    uses: dtekcth/workflows/.github/workflows/bump-version.yml@main
    permissions:
      contents: write
      packages: write
    with:
      update_type: none
      new_version: "${{ needs.bump-local.outputs.new_version }}"
