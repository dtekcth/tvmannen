name: Bump version

on:
  workflow_dispatch:
    update_type:
      type:
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-local:
    steps:
      - name: Bump version locally
        run: "uv version --bump ${{ inputs.update_type }}"

      - name: Get new version
        id: new_version
        run: 'uv version --short >> "$GITHUB_OUTPUT"'

  bump-remote:
    needs: bump-local
    uses: dtekcth/workflows/.github/workflows/bump-version.yml
    permissions:
      contents: write
      packages: write
    with:
      update_type: none
      new_version: "${{ steps.new_version.outputs.value }}"
