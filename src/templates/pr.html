<!-- Page for displaying PRs -->
<!DOCTYPE html>
<html>
<head>
  <title>TV-Mannen</title>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="300">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #fe8803;
      background-position: center;
      background-size: contain;
      background-image: url(https://dtek.se/static/datalogo.svg);
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      font-family: Helvetica, Arial, Sans-Serif;
      font-size: 3em;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      border: none;
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: none;
    }
  </style>
  <script>
    const PR_TIME = {{ pr_time }};
    const PR_FETCH_TIME = {{ pr_fetch_time }};
    let prs = undefined;
    let timeout = undefined;
    let image_offset = 0;

    function next_pr() {
      if (timeout) {
        clearTimeout(timeout);
      }

      const body = document.body;

      // No PR -> show dtek logo
      if (!prs || prs.length < 1) {
        body.style.backgroundImage = "url(https://dtek.se/static/datalogo.svg)";
        body.replaceChildren();
        return;
      }

      // Base which PR to use on time passed since unix epoch.
      // Can be overridden by advancing to next PR manually.
      const pr_num_since_unix = Math.floor(Date.now() / 1000 / PR_TIME);
      const pr_index = (pr_num_since_unix + image_offset) % prs.length;
      const pr = prs[pr_index];

      if (pr.iframe) {
        // Iframe
        const iframe = document.createElement('iframe');
        iframe.src = encodeURI(pr.link);
        iframe.width = "100%";
        iframe.height = "100%";
        iframe.style.background = 'white';

        body.style.backgroundImage = "none";
        body.replaceChildren(iframe)
      } else if (pr.link.endsWith(".mp4")) {
        // Video (only mp4)
        const video = document.createElement('video');
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.src = pr.link;

        body.style.backgroundImage = "none";
        body.replaceChildren(video);
      } else {
        // Image
        body.style.backgroundImage = `url(${pr.link})`;
        body.replaceChildren();
      }

      // Sleep until next pr
      const milliseconds_left = (pr_num_since_unix + 1) * PR_TIME * 1000 - Date.now();
      timeout = setTimeout(next_pr, milliseconds_left);
    }

    // Get list of PRs from /pr
    function get_prs() {
      fetch("/pr")
        .then(response => response.json())
        .then(new_prs => {
          const prev_prs = prs;
          prs = new_prs;

          // Call next_pr on first load
          if (!prev_prs) {
            next_pr();
          }
        });
    }

    // Naively switch to next PR when pressing spacebar
    document.addEventListener("keypress", e => {
      if (e.keyCode === 32) {
        image_offset++;
        next_pr();
      }
    });
    // Naively switch to next PR when touching the screen
    document.addEventListener("touched", () => {
      image_offset++;
      next_pr();
    });

    // How often the PR list is updated
    setInterval(get_prs, PR_FETCH_TIME * 1000);
  </script>
</head>
<body onload="get_prs()">
</body>
</html>
